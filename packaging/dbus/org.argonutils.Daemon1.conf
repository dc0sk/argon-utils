<!--
  Who may own argond's bus name, and who may talk to it.

  Only the `argon` user, the service account argond runs as, may own the name, so nothing
  else can impersonate the daemon. Anyone may *call* it: every method that acts on the machine
  checks polkit itself (action org.argonutils.poweroff-with-wake), and the rest only report.
  Installed to /usr/share/dbus-1/system.d/.
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="argon">
    <allow own="org.argonutils.Daemon1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.argonutils.Daemon1"
           send_interface="org.argonutils.Daemon1"/>
    <allow send_destination="org.argonutils.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.argonutils.Daemon1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
