[package]
name        = "argon-proto"
description = "Pure, I/O-free codecs for Argon40 Raspberry Pi enclosure and UPS hardware"
keywords    = ["raspberry-pi", "argon40", "ups", "no-std", "protocol"]
categories  = ["embedded", "no-std", "parser-implementations"]
readme      = "README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license                = "GPL-3.0-or-later OR MPL-2.0"
repository.workspace   = true
authors.workspace      = true

[features]
default = ["alloc"]
# Descriptor parsing builds a table of fields, which needs a growable collection.
alloc   = []

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
