[package]
name        = "argon-hal"
description = "Linux transports and read-only hardware discovery for Argon40 devices"
keywords    = ["raspberry-pi", "argon40", "i2c", "gpio", "hardware"]
categories  = ["hardware-support", "os::linux-apis"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
argon-proto = { path = "../argon-proto", version = "0.1.0" }
i2cdev      = "0.6.2"
gpiocdev    = "0.8"
# Safe, unsafe-free syscall wrappers. Used for poll(2): hidraw readiness needs a real
# readiness check, and the alternative is either an unsafe ioctl or a lie.
rustix      = { version = "1", features = ["event"] }
# 4.10.0 is yanked; cargo-deny fails the build on yanked deps.
serialport  = "4.10.1"

[dev-dependencies]
argon-sim = { path = "../argon-sim", version = "0.1.0" }

[lints]
workspace = true
