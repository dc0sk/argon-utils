name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: rustup show   # honours rust-toolchain.toml
      - name: Install bare-metal target
        # argon-proto must stay I/O-free: the whole test strategy depends on it being
        # testable without hardware. Building it for a target with no operating system is
        # the check -- adding a std or I/O dependency fails it.
        run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      # One script, run identically here and locally, so the two cannot drift. It captures
      # each command's real exit status -- a piped `grep | head` reports head's status, not
      # the checker's, which is how a failing lint comes to read as a clean run.
      - name: Gate
        run: ./scripts/gate.sh

  cross:
    name: aarch64 cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu --locked

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca6268d5947a7a16b4649013fea1 # v2.0.11
        with:
          command: check
