name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    # On arm64, the architecture the software runs on (Raspberry Pi 5 / CM5), natively: no
    # cross-compilation, and so no arm64 libudev to provide for it.
    name: gate (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: System packages
        # libudev and pkg-config for the serialport crate; xmllint and dtc for the gate's
        # packaging-XML and lid-overlay checks.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config libxml2-utils device-tree-compiler
      - name: Install toolchain
        # The arm64 runner image may not carry rustup; `rustup show` then honours
        # rust-toolchain.toml.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show
      - name: Install bare-metal target
        # argon-proto must stay I/O-free: the whole test strategy depends on it being
        # testable without hardware. Building it for a target with no operating system is
        # the check -- adding a std or I/O dependency fails it.
        run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      # One script, run identically here and locally, so the two cannot drift. It captures
      # each command's real exit status -- a piped `grep | head` reports head's status, not
      # the checker's, which is how a failing lint comes to read as a clean run.
      - name: Gate
        run: ./scripts/gate.sh

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # rust-toolchain.toml pins a toolchain the action's container does not have;
          # install that one rather than fail on it.
          rust-version: "1.95.0"
