[graph]
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[licenses]
# GPL-3.0-or-later project: only GPL-compatible licenses may appear in the tree.
allow = [
    "GPL-3.0", "LGPL-3.0", "MPL-2.0",
    "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[advisories]
yanked = "deny"     # serialport 4.10.0 is yanked; this catches that class of problem

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
