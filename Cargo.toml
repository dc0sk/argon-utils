[workspace]
resolver = "3"
members = [
    "crates/argon-proto",
    "crates/argon-hal",
    "crates/argon-cli",
    "crates/argon-sim",
    "crates/argon-device",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/dc0sk/argon-utils"
authors      = ["Simon Keimer <dc0sk@mailbox.org>"]

[workspace.lints.rust]
unsafe_code       = "forbid"
missing_docs      = "warn"
rust_2018_idioms  = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
pedantic       = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"

[profile.release]
panic     = "abort"
lto       = true
codegen-units = 1
strip     = true
