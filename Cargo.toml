[workspace]
resolver = "3"
members = [
    "crates/argon-proto",
    "crates/argon-hal",
    "crates/argon-cli",
    "crates/argon-sim",
    "crates/argon-device",
    "crates/argon-daemon",
    "crates/argon-telemetry",
    "crates/argon-tray",
]

[workspace.package]
version      = "0.1.31"
edition      = "2024"
rust-version = "1.85"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/dc0sk/argon-utils"
authors      = ["Simon Keimer <dc0sk@mailbox.org>"]

[workspace.lints.rust]
unsafe_code       = "forbid"
missing_docs      = "warn"
rust_2018_idioms  = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
pedantic       = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"

[profile.release]
# Deliberately NOT panic = "abort".
#
# This software's worst failure mode is leaving the fan stopped on a machine that is heating
# up. The mitigation is a Drop guard that restores a safe duty as the daemon unwinds -- and
# under panic = "abort" a Drop impl simply does not run, which was verified rather than
# assumed. Choosing abort would leave the guard in the source, passing its unit tests under
# the test profile, and inert in every build that ships.
#
# The systemd ExecStopPost hook is the backstop for SIGKILL, where no in-process mechanism
# can help. It is not a substitute for unwinding, because it cannot run while the process
# is still alive and holding the bus.
panic     = "unwind"
lto       = true
codegen-units = 1
strip     = true
